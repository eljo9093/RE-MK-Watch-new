name: Build REMK Pixel Watch 4 APK v26.4

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-watch-apk:
    name: Build Pixel Watch 4 APK (:wear only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare and Compile Watch APK (:wear)
        shell: bash
        run: |
          WEAR_FILE=$(find . -name "build.gradle.kts" | grep "/wear/" | head -n 1)
          if [ -n "$WEAR_FILE" ]; then
            cd "$(dirname "$(dirname "$WEAR_FILE")")"
          fi
          python3 -c 'import os; q = chr(34); os.makedirs("wear/src/main/res/drawable", exist_ok=True); os.makedirs("wear/src/main/res/values", exist_ok=True); os.path.exists("wear/src/main/res/drawable/ic_launcher.png") and os.remove("wear/src/main/res/drawable/ic_launcher.png"); xml = "<vector xmlns:android=" + q + "http://schemas.android.com/apk/res/android" + q + " android:width=" + q + "108dp" + q + " android:height=" + q + "108dp" + q + " android:viewportWidth=" + q + "108" + q + " android:viewportHeight=" + q + "108" + q + "><path android:fillColor=" + q + "#05070B" + q + " android:pathData=" + q + "M0,0h108v108h-108z" + q + "/><path android:fillColor=" + q + "#FF5E00" + q + " android:pathData=" + q + "M54,12A42,42 0,1 1,12 54A42,42 0,0 1,54 12zM54,20A34,34 0,1 0,88 54A34,34 0,0 0,54 20z" + q + "/><path android:fillColor=" + q + "#10B981" + q + " android:pathData=" + q + "M46,34L66,34L54,52L68,52L44,78L50,56L38,56Z" + q + "/></vector>"; open("wear/src/main/res/drawable/ic_launcher.xml", "w", encoding="utf-8").write(xml)'
          python3 -c 'import os; q = chr(34); st = "<resources><style name=" + q + "RemkWatchTheme" + q + " parent=" + q + "@android:style/Theme.DeviceDefault" + q + "><item name=" + q + "android:windowNoTitle" + q + ">true</item><item name=" + q + "android:windowActionBar" + q + ">false</item><item name=" + q + "android:windowBackground" + q + ">@android:color/black</item><item name=" + q + "android:colorBackground" + q + ">@android:color/black</item></style></resources>"; open("wear/src/main/res/values/styles.xml", "w", encoding="utf-8").write(st)'
          python3 -c 'import os, re; p = "wear/src/main/AndroidManifest.xml"; c = open(p, encoding="utf-8").read() if os.path.exists(p) else ""; c = c.replace("@android:style/Theme.DeviceDefault", "@style/RemkWatchTheme"); c = re.sub(r"<meta-data[^>]*androidx\.wear\.tiles\.PREVIEW[^>]*/>", "", c); os.path.exists(p) and open(p, "w", encoding="utf-8").write(c)'
          python3 -c 'import os, re; p = "wear/src/main/java/eu/remk/coaching/wear/RemkTileService.kt"; c = open(p, encoding="utf-8").read() if os.path.exists(p) else ""; c = c.replace("import androidx.wear.protolayout.DimensionBuilders.dp", "import androidx.wear.protolayout.DimensionBuilders.dp\nimport androidx.wear.protolayout.DimensionBuilders.expand"); c = c.replace(".setWidth(dp(192f))", ".setWidth(expand())").replace(".setHeight(dp(192f))", ".setHeight(expand())"); c = re.sub(r"\.setPadding\(\s*ModifiersBuilders\.Padding\.Builder\(\)\s*\.setStart\(dp\(([0-9.]+f)\)\)\.setEnd\(dp\(([0-9.]+f)\)\)\.setTop\(dp\(([0-9.]+f)\)\)\.setBottom\(dp\(([0-9.]+f)\)\)\s*\.build\(\)\s*\)\s*\.setModifiers\(\s*ModifiersBuilders\.Modifiers\.Builder\(\)", r".setModifiers(ModifiersBuilders.Modifiers.Builder().setPadding(ModifiersBuilders.Padding.Builder().setStart(dp(\1)).setEnd(dp(\2)).setTop(dp(\3)).setBottom(dp(\4)).build())", c); os.path.exists(p) and open(p, "w", encoding="utf-8").write(c)'
          python3 -c 'import glob; bs, nl, cr, q = chr(92), chr(10), chr(13), chr(34); [open(p, "w", encoding="utf-8").write(open(p, encoding="utf-8").read().replace(cr, "").replace("}L" + nl, "}L" + bs + "n").replace("Zahnrad-Schnellwahl" + nl, "Zahnrad-Schnellwahl" + bs + "n").replace("Wdh." + nl, "Wdh." + bs + "n").replace(" km" + nl, " km" + bs + "n").replace(" kcal offen" + nl, " kcal offen" + bs + "n").replace("contentContainer.addView(kpiRow)", "contentContainer.addView(kpiRow, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))").replace("contentContainer.addView(exCard)", "contentContainer.addView(exCard, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))").replace("contentContainer.addView(dialRow)", "contentContainer.addView(dialRow, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))").replace("contentContainer.addView(mealRow)", "contentContainer.addView(mealRow, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))").replace("contentContainer.addView(shopRow)", "contentContainer.addView(shopRow, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))").replace("mainScroll.addView(contentContainer)", "mainScroll.addView(contentContainer, ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))")) for p in glob.glob("wear/src/main/java/**/*.kt", recursive=True)]'
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          gradle :wear:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/watch_apk_out"
          cp wear/build/outputs/apk/debug/wear-debug.apk "$GITHUB_WORKSPACE/watch_apk_out/REMK-Pixel-Watch-4-Standalone-v26-4.apk"

      - name: Upload Pixel Watch 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: REMK-Pixel-Watch-4-Standalone-APK-v26-4
          path: watch_apk_out/REMK-Pixel-Watch-4-Standalone-v26-4.apk
