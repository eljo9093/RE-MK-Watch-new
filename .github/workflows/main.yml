name: Build REMK Pixel Watch 4 APK v26.4

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-watch-apk:
    name: Build Pixel Watch 4 APK (:wear only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare and Compile Watch APK (:wear)
        shell: bash
        run: |
          WEAR_FILE=$(find . -name "build.gradle.kts" | grep "/wear/" | head -n 1)
          if [ -n "$WEAR_FILE" ]; then
            cd "$(dirname "$(dirname "$WEAR_FILE")")"
          fi
          python3 -c 'import os; os.makedirs("wear/src/main/res/drawable", exist_ok=True); os.path.exists("wear/src/main/res/drawable/ic_launcher.png") and os.remove("wear/src/main/res/drawable/ic_launcher.png"); open("wear/src/main/res/drawable/ic_launcher.xml", "w", encoding="utf-8").write("<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#05070B" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FF5E00" android:pathData="M54,12A42,42 0,1 1,12 54A42,42 0,0 1,54 12zM54,20A34,34 0,1 0,88 54A34,34 0,0 0,54 20z"/><path android:fillColor="#10B981" android:pathData="M46,34L66,34L54,52L68,52L44,78L50,56L38,56Z"/></vector>")'
          python3 -c 'import glob; bs, nl, cr = chr(92), chr(10), chr(13); [open(p, "w", encoding="utf-8").write(open(p, encoding="utf-8").read().replace(cr, "").replace("}L" + nl, "}L" + bs + "n").replace("Zahnrad-Schnellwahl" + nl, "Zahnrad-Schnellwahl" + bs + "n").replace("Wdh." + nl, "Wdh." + bs + "n").replace(" km" + nl, " km" + bs + "n").replace(" kcal offen" + nl, " kcal offen" + bs + "n")) for p in glob.glob("wear/src/main/java/**/*.kt", recursive=True)]'
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          gradle :wear:assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/watch_apk_out"
          cp wear/build/outputs/apk/debug/wear-debug.apk "$GITHUB_WORKSPACE/watch_apk_out/REMK-Pixel-Watch-4-Standalone-v26-4.apk"

      - name: Upload Pixel Watch 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: REMK-Pixel-Watch-4-Standalone-APK-v26-4
          path: watch_apk_out/REMK-Pixel-Watch-4-Standalone-v26-4.apk
